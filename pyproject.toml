[project]
name = "hy-status"
version = "0.1.0"
description = "Factual status lines for Hello Yellow client workstreams"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
drive = ["google-auth>=2", "requests>=2"]

[project.scripts]
hy-status = "hy_status.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hy_status"]
